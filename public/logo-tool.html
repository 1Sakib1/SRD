
<!DOCTYPE html>
<html style="background:#111; color:white; font-family:sans-serif; text-align:center; padding:50px;">
<head>
  <title>Logo Generator</title>
</head>
<body>
  <h1>Generating HD Logo...</h1>
  <canvas id="c" width="512" height="512" style="display:none;"></canvas>
  <script>
    const img = new Image();
    img.src = 'data:image/svg+xml;base64,' + btoa(`<svg viewBox="0 0 100 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="litterpin-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  
  <path d="M50,0 C22.4,0 0,22.4 0,50 C0,78 50,120 50,120 C50,120 100,78 100,50 C100,22.4 77.6,0 50,0 Z" fill="url(#litterpin-gradient)" />
  
  <rect x="25" y="25" width="50" height="32" rx="4" fill="white" />
  <circle cx="67" cy="32" r="2.5" fill="url(#litterpin-gradient)" />
  <circle cx="50" cy="41" r="11" fill="url(#litterpin-gradient)" />
  <circle cx="50" cy="41" r="8" fill="white" />
  
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" />
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" transform="rotate(60 50 41)" />
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" transform="rotate(120 50 41)" />
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" transform="rotate(180 50 41)" />
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" transform="rotate(240 50 41)" />
  <path d="M50,33 L55,41 L50,41 Z" fill="url(#litterpin-gradient)" transform="rotate(300 50 41)" />
  
  <polygon points="48,39 52,39 54,43 50,45 46,43" fill="white" />

  <path d="M50,68 C38,68 35,88 50,98 C50,98 50,98 50,98 C50,98 50,98 50,98 C65,88 62,68 50,68 Z" fill="white" />
  <path d="M50,68 C45,80 50,95 50,95" stroke="url(#litterpin-gradient)" stroke-width="1.5" fill="none" />
  <path d="M50,85 L44,80" stroke="url(#litterpin-gradient)" stroke-width="1.5" fill="none" />
  <path d="M50,78 L54,73" stroke="url(#litterpin-gradient)" stroke-width="1.5" fill="none" />
  
  <path d="M50,98 Q50,110 45,115" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
`);
    img.onload = () => {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 512);
      
      // Draw centered
      const padding = 64;
      const w = 512 - padding * 2;
      const h = (120/100) * w;
      const y = (512 - h) / 2;
      
      ctx.drawImage(img, padding, y, w, h);
      
      const a = document.createElement('a');
      a.download = 'LitterPin-HD-Logo.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
      
      document.body.innerHTML = '<h1>✅ Downloaded LitterPin-HD-Logo.png</h1><p>You can now upload this high-definition transparent PNG to Google Cloud!</p>';
    };
  </script>
</body>
</html>
